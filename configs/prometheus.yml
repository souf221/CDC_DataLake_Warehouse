global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cdc-lakehouse-metrics"
    static_configs:
      - targets: ["metrics-exporter:8000"]
        labels:
          service: "cdc-pipeline"

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "postgres"
  # Nécessite postgres_exporter si activé
