# =============================================================================
# CDC Data Lakehouse - Docker Compose
# Architecture Medallion : Bronze → Silver → Gold
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.2-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      pyspark==3.5.1 delta-spark==3.1.0 boto3==1.34.69 minio==7.2.5
      requests==2.31.0 pandas==2.2.1 great-expectations==0.18.12
      psycopg2-binary==2.9.9 sqlalchemy==2.0.28 pypdf==4.1.0 pdfplumber==0.11.0
      prometheus-client==0.20.0 pyyaml==6.0.1 python-dotenv==1.0.1
      apache-airflow-providers-apache-spark==4.7.1
      apache-airflow-providers-postgres==5.11.1
    DATA_MODE: ${DATA_MODE:-sample}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    MINIO_BUCKET: ${MINIO_BUCKET:-cdc-lakehouse}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-cdc_warehouse}
    POSTGRES_USER: ${POSTGRES_USER:-cdc_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_password}
    SPARK_MASTER: spark://spark-master:7077
    CDC_API_BASE_URL: https://data.cdc.gov/resource
    CDC_APP_TOKEN: ${CDC_APP_TOKEN:-}
    PYTHONPATH: /opt/airflow/project/src
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/project/src
    - ./configs:/opt/airflow/project/configs
    - ./data:/opt/airflow/project/data
    - ./scripts:/opt/airflow/project/scripts
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # Stockage objet S3 (MinIO)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cdc-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb local/${MINIO_BUCKET:-cdc-lakehouse} --ignore-existing;
      mc anonymous set download local/${MINIO_BUCKET:-cdc-lakehouse}/gold;
      echo 'MinIO bucket initialized';
      "

  # ---------------------------------------------------------------------------
  # PostgreSQL Data Warehouse
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cdc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdc_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-cdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_warehouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdc_user} -d ${POSTGRES_DB:-cdc_warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Apache Spark (cluster local)
  # ---------------------------------------------------------------------------
  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: cdc-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/bitnami/spark/project/src
      - ./configs:/opt/bitnami/spark/project/configs
      - ./data:/opt/bitnami/spark/project/data

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: cdc-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/bitnami/spark/project/src
      - ./configs:/opt/bitnami/spark/project/configs
      - ./data:/opt/bitnami/spark/project/data

  # ---------------------------------------------------------------------------
  # Airflow (orchestration)
  # ---------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:16-alpine
    container_name: cdc-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: cdc-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname CDC \
          --role Admin \
          --email admin@cdc.local || true
        echo "Airflow initialized"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: cdc-airflow-webserver
    command: webserver
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: cdc-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Monitoring (Prometheus + Grafana + Pushgateway)
  # ---------------------------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:v1.7.0
    container_name: cdc-pushgateway
    ports:
      - "9091:9091"
    restart: always

  metrics-exporter:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: cdc-metrics-exporter
    ports:
      - "8000:8000"
    environment:
      METRICS_PORT: 8000
    volumes:
      - ./src:/app/src
    restart: always

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: cdc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - pushgateway
      - metrics-exporter
    restart: always

  grafana:
    image: grafana/grafana:10.3.3
    container_name: cdc-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/grafana:/etc/grafana/provisioning/dashboards
      - ./dashboards/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: always

  # ---------------------------------------------------------------------------
  # BI Dashboard (Metabase)
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.49.3
    container_name: cdc-metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-cdc_user}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-cdc_password}
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # ---------------------------------------------------------------------------
  # Dashboard KPI (FastAPI + frontend statique)
  # ---------------------------------------------------------------------------
  kpi-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: cdc-kpi-dashboard
    ports:
      - "8500:8500"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cdc_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-cdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_password}
      KPI_DASHBOARD_PORT: 8500
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  minio-data:
  postgres-data:
  airflow-postgres-data:
  airflow-logs:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: cdc-lakehouse-network
